        (function() {
            const fileId = '3D_TẮC RUỘT SƠ SINH.html';

            function updateV4() {
                const bookmarks = JSON.parse(localStorage.getItem('pwa_bookmarks') || '[]');
                const completed = JSON.parse(localStorage.getItem('pwa_completed') || '[]');
                const heartBtn = document.getElementById('btn-bm-v4-' + btnId);
                const checkBtn = document.getElementById('btn-cp-v4-' + btnId);
                
                if (bookmarks.includes(fileId)) {
                    heartBtn.classList.remove('text-slate-400'); heartBtn.classList.add('text-red-500');
                    heartBtn.querySelector('i').style.textShadow = '0 0 10px rgba(239, 68, 68, 0.5)';

                    heartBtn.classList.add('text-slate-400'); heartBtn.classList.remove('text-red-500');
                    heartBtn.querySelector('i').style.textShadow = 'none';
                }
                
                if (completed.includes(fileId)) {
                    checkBtn.classList.remove('text-slate-400'); checkBtn.classList.add('text-emerald-400');
                    checkBtn.querySelector('span').innerText = '100%';
                    checkBtn.querySelector('i').style.textShadow = '0 0 10px rgba(52, 211, 153, 0.5)';

                    checkBtn.classList.add('text-slate-400'); checkBtn.classList.remove('text-emerald-400');
                    checkBtn.querySelector('span').innerText = 'ĐÃ XONG';
                    checkBtn.querySelector('i').style.textShadow = 'none';
                }
            }
            window.toggleBookmarkV4 = function(id) {
                let arr = JSON.parse(localStorage.getItem('pwa_bookmarks') || '[]');
                if (arr.includes(id)) arr = arr.filter(x => x !== id); else arr.push(id);
                localStorage.setItem('pwa_bookmarks', JSON.stringify(arr)); updateV4();
            };
            window.toggleCompleteV4 = function(id) {
                let arr = JSON.parse(localStorage.getItem('pwa_completed') || '[]');
                if (arr.includes(id)) arr = arr.filter(x => x !== id); else arr.push(id);
                localStorage.setItem('pwa_completed', JSON.stringify(arr)); updateV4();
            };
            document.addEventListener("DOMContentLoaded", updateV4);
        })();

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.halo.min.js"></script>
<script type="text/babel">


const { useState, useEffect, useRef } = React;

function parseQuizData(text) {
    const lines = text.split('\n').map(l => l.trim()).filter(l => l);
    const questions = [];
    let currentQ = null;
    let currentMode = 'context';
    let currentContext = "";
    let isBuildingContext = false;

    lines.forEach(line => {
        line = line.replace(/^[\u2022\u00b7\-\*]\s*/, '').trim();
        if (!line) return;

        const isSection = line.match(/^(?:PHẦN|Phần)\s+[I|V|X|\d]+/i);
        if (isSection) {
            currentContext = "";
            isBuildingContext = false;
        }

        const isCaseStart = line.match(/^(?:TÌNH HUỐNG LÂM SÀNG|Case lâm sàng|Tình huống|Case\s*\d+)/i);
        const isQ = line.match(/^(?:Câu|Question)[^\d]*([\d\.]+)(?:[^a-z0-9]*[:\.\-])?\s*(.*)/i);
        const isOpt = line.match(/^\(?([A-E])\)?[\.\)\:\-\/]\s*(.*)/i);
        const isAns = line.match(/^(?:Đáp án(?: đúng)?|Answer)\s*[:\.\-]?\s*\(?([A-E])\)?/i);

        if (isCaseStart && !isQ) {
            currentContext = line + '\n';
            isBuildingContext = true;
            currentMode = 'context';
            return;
        }

        if (isQ && !isAns) {
            isBuildingContext = false;
            if (currentQ) questions.push(currentQ);
            
            currentQ = { 
                id: questions.length + 1, 
                originalId: isQ[1], 
                context: currentContext.trim(), 
                question: isQ[2] || '', 
                options: {}, 
                answer: '' 
            };
            currentMode = 'question';
            return;
        }

        // Lọc bỏ 100% phần giải thích
        if (isAns && currentQ) {
            currentQ.answer = isAns[1].toUpperCase();
            currentMode = 'skip';
            return;
        }
        
        if (line.match(/^(Giải thích|Tại sao các lựa chọn khác|Tài liệu được biên soạn|Nghiêm cấm sao chép|Đúng:|Sai:)/i)) {
            currentMode = 'skip';
            return;
        }

        if (currentMode === 'skip') return;

        if (isBuildingContext) {
            if (!line.match(/^(TRẮC NGHIỆM|BASEDOW|BỆNH LÝ BASEDOW|HỘI CHỨNG|ĐỘT QUỴ|ĐỘNG KINH|COPD|ĐÁI MÁU|NỘI KHOA|TEAMDRCAT|==========|Tài liệu được|Nghiêm cấm|\[🛑)/i)) {
                currentContext += line + '\n';
            }
            return;
        }

        if (currentQ) {
            if (isOpt) {
                currentQ.options[isOpt[1].toUpperCase()] = isOpt[2].trim();
                currentMode = 'options';
            } else if (currentMode === 'question') {
                currentQ.question += '\n' + line;
            } else if (currentMode === 'options') {
                const keys = Object.keys(currentQ.options);
                if (keys.length > 0) {
                    const lastKey = keys[keys.length - 1];
                    currentQ.options[lastKey] += '\n' + line;
                }
            } 
        }
    });
    if (currentQ) questions.push(currentQ);

    const mergedQuestions = [];
    questions.forEach(q => {
        const isAnswerKey = Object.keys(q.options).length === 0 && !q.context;
        if (isAnswerKey) {
            const existingQ = mergedQuestions.find(mq => mq.originalId === q.originalId && !mq.answer);
            if (existingQ) {
                if (q.answer) existingQ.answer = q.answer;
                return;
            }
        }
        mergedQuestions.push(q);
    });
    mergedQuestions.forEach((q, idx) => { q.id = idx + 1; });
    questions.length = 0;
    mergedQuestions.forEach(q => questions.push(q));

    const cln = (s) => (s||'').replace(/\\[Nn]/g, '\n').replace(/\\n/g, '\n').replace(/\n\s*\n/g, '\n').trim();
    questions.forEach(q => { if(q.context) q.context=cln(q.context); if(q.question) q.question=cln(q.question); for(let k in q.options) q.options[k]=cln(q.options[k]); });
    return questions;
}

const playCorrectSound = () => {
    try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.15);
    } catch (e) { console.error(e); }
};

const playIncorrectSound = () => {
    try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.2);
    } catch (e) { console.error(e); }
};


const RealTimeClock = () => {
    const [time, setTime] = React.useState(new Date());
    React.useEffect(() => {
        const timer = setInterval(() => setTime(new Date()), 1000);
        return () => clearInterval(timer);
    }, []);
    
    React.useEffect(() => {
        if (appState === 'result' && window.confetti) {
            let correctCount = 0;
            for (let i = 0; i < questions.length; i++) {
                if (answers[i] === questions[i].answer) correctCount++;
            }
            if (questions.length > 0 && (correctCount / questions.length) >= 0.5) {
                const duration = 3 * 1000;
                const animationEnd = Date.now() + duration;
                const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };
                const randomInRange = (min, max) => Math.random() * (max - min) + min;
                const interval = setInterval(function() {
                    const timeLeft = animationEnd - Date.now();
                    if (timeLeft <= 0) { return clearInterval(interval); }
                    const particleCount = 50 * (timeLeft / duration);
                    window.confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                    window.confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
                }, 250);
            }
        }
    }, [appState]);

    const formatTime = (date) => {
        const d = date.getDay();
        const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
        const dayStr = days[d];
        const dateStr = date.toLocaleDateString('vi-VN', {day:'2-digit', month:'2-digit', year:'numeric'});
        const timeStr = date.toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
        return `${timeStr} - ${dayStr}, ${dateStr}`;
    };
    return (
        <div className="hidden lg:flex items-center gap-2 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white/50 dark:bg-slate-800/50 text-slate-600 dark:text-slate-300 font-mono text-xs font-bold shadow-sm">
            <i className="fa-regular fa-clock text-blue-500"></i>
            {formatTime(time)}
        </div>
    );
};

    const [showMatrix, setShowMatrix] = useState(window.innerWidth >= 768);

            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(60, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.5, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);

            }).join(''));
        }

                                <i className="fa-solid fa-magnifying-glass-plus text-emerald-500 w-5 text-center"></i> <span className="text-sm font-semibold dark:text-slate-300">Phóng to</span>
                            </button>
                            <button onClick={() => setZoomLevel(prev => Math.max(prev - 10, 50))} className="text-left w-full px-4 py-2.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl flex items-center gap-3 transition-colors">

                    <div className="p-12 pb-8 flex flex-col items-center text-center relative overflow-hidden">

                        <div className="w-24 h-24 bg-white dark:bg-slate-800 rounded-full mb-6 shadow-xl border border-blue-100 dark:border-slate-700 flex items-center justify-center relative group">
                            <div className="absolute inset-0 bg-blue-400 rounded-full opacity-20 group-hover:scale-150 transition-transform duration-700"></div>

                        </div>
                        <h1 className="text-3xl sm:text-4xl md:text-5xl font-black uppercase tracking-tighter mb-3 z-10 bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-cyan-600 dark:from-blue-400 dark:to-cyan-400 drop-shadow-sm">CASE LÂM SÀNG NGOẠI KHOA</h1>
                        <p className="text-blue-700 dark:text-blue-300 text-lg font-bold tracking-widest uppercase z-10 opacity-80">CHUYÊN ĐỀ: {diseaseName}</p>
                    </div>
                    <div className="p-10 pt-2 bg-white/40 dark:bg-slate-900/40 backdrop-blur-md">

                                <div className="bg-blue-100 dark:bg-blue-900/50 w-12 h-12 flex items-center justify-center rounded-xl text-red-600 dark:text-red-400 shadow-inner"><i className="fa-solid fa-layer-group text-xl"></i></div>

                                <div><p className="text-[10px] text-slate-500 dark:text-slate-400 font-black uppercase tracking-widest mb-1">Thời gian</p><p className="text-2xl font-black text-slate-800 dark:text-slate-100 leading-none">{questions.length} Phút</p></div>
                            </div>
                        </div>
                        <div className="bg-blue-50/80 dark:bg-blue-900/20 rounded-2xl p-6 mb-10 border border-blue-100 dark:border-blue-800/30 flex items-start gap-4 text-blue-900 dark:text-blue-100 shadow-inner">
                            <i className="fa-solid fa-circle-info shrink-0 mt-0.5 text-2xl text-cyan-600 dark:text-cyan-400"></i>
                            <div className="text-base leading-relaxed font-medium">
                                <p className="font-bold mb-3 text-cyan-800 dark:text-cyan-300 text-lg">Hướng dẫn làm bài:</p>
                                <ul className="list-disc pl-5 space-y-2 opacity-90 marker:text-cyan-600 dark:marker:text-cyan-400">

                                    <li>Khi đã chọn, bạn <strong className="text-cyan-900 dark:text-cyan-200 font-bold">không thể thay đổi</strong> đáp án của câu đó.</li>
                                    <li>Sử dụng nút <strong className="text-cyan-900 dark:text-cyan-200 font-bold">Đánh dấu cờ</strong> để lưu lại những câu khó.</li>
                                    <li><i className="fa-solid fa-keyboard mr-1 opacity-70"></i> Phím tắt điểu khiển: Ghép <strong className="text-cyan-900 dark:text-cyan-200 font-bold">A, B, C, D</strong> để chọn; <strong className="text-cyan-900 dark:text-cyan-200 font-bold">Mũi tên</strong> để chuyển câu; <strong className="text-cyan-900 dark:text-cyan-200 font-bold">Phím Space</strong> để cắm cờ.</li>

    return (

                    <div className="bg-gradient-to-r from-blue-600 to-cyan-600 px-4 py-3 flex justify-between items-center text-white cursor-move" style={{ touchAction: 'none' }} onPointerDown={(e) => { if(e.target.closest('button')) return; const el = e.currentTarget; const panel = el.parentElement; el.setPointerCapture(e.pointerId); const startX = e.clientX; const startY = e.clientY; const transformStr = panel.style.transform; let initialDx = 0, initialDy = 0; if(transformStr && transformStr.includes('translate(')) { const match = transformStr.match(/translate\(([-\d.]+)px,\s*([-\d.]+)px\)/); if(match) { initialDx = parseFloat(match[1]); initialDy = parseFloat(match[2]); } } const onMove = (moveEvent) => { const dx = initialDx + (moveEvent.clientX - startX); const dy = initialDy + (moveEvent.clientY - startY); const newTransform = `translate(${dx}px, ${dy}px)`; panel.style.transform = newTransform; window._drNoteTransform = newTransform; }; const onUp = () => { el.removeEventListener('pointermove', onMove); el.removeEventListener('pointerup', onUp); el.releasePointerCapture(e.pointerId); }; el.addEventListener('pointermove', onMove); el.addEventListener('pointerup', onUp); }}>

                    <div className="p-0">
                        <textarea 
                            value={drNoteContent}
                            onChange={(e) => setDrNoteContent(e.target.value)}

                            style={{ backgroundImage: 'linear-gradient(transparent, transparent 27px, #cbd5e1 28px)', backgroundSize: '100% 28px', lineHeight: '28px' }}
                        ></textarea>
                    </div>
                </div>
            )}
            
            {showMatrix && <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-40 md:hidden transition-opacity" onClick={() => setShowMatrix(false)}></div>}
            
            <aside className={`fixed md:sticky top-0 right-0 h-screen w-[85vw] max-w-[320px] md:max-w-none glass-panel z-50 flex flex-col transition-all duration-500 ease-in-out ${showMatrix ? 'translate-x-0 md:w-[400px] md:min-w-[400px] md:opacity-100' : 'translate-x-full md:w-0 md:min-w-0 md:opacity-0 overflow-hidden md:border-none md:p-0'} md:order-2 shadow-[-10px_0_30px_rgba(0,0,0,0.05)] dark:shadow-none border-l border-white/40 dark:border-slate-700/50`}>
                <div className="p-6 border-b border-slate-200/50 dark:border-slate-700/50 flex justify-between items-center bg-white/60 dark:bg-slate-800/60 backdrop-blur-xl sticky top-0 shadow-sm border-b border-white/50 z-10">

                </div>
                <div className="flex-1 overflow-y-auto p-6 custom-scrollbar grid grid-cols-5 gap-3 content-start">
                    {questions.map((q, i) => {
                        let navBtnClass = "h-12 w-full rounded-2xl text-sm font-black border transition-all duration-300 relative flex items-center justify-center hover:brightness-95 bg-white/60 dark:bg-slate-700/60 text-slate-500 border-white/50 dark:border-slate-600/50 dark:text-slate-300 shadow-sm hover:-translate-y-1 hover:shadow-md";
                        if (!!answers[i]) {
                            if (answers[i] === q.answer) {
                                navBtnClass = "h-12 w-full rounded-2xl text-sm font-black border-2 transition-all duration-300 relative flex items-center justify-center hover:brightness-95 bg-green-100/90 dark:bg-green-900/60 text-green-700 dark:text-green-300 border-green-400/50 dark:border-green-600/50 shadow-sm hover:-translate-y-1";
                            } else {
                                navBtnClass = "h-12 w-full rounded-2xl text-sm font-black border-2 transition-all duration-300 relative flex items-center justify-center hover:brightness-95 bg-red-100/90 dark:bg-red-900/60 text-red-700 dark:text-red-300 border-red-400/50 dark:border-red-600/50 shadow-sm hover:-translate-y-1";
                            }
                        }
                        if (currentIndex === i && appState !== 'review') {
                            navBtnClass += " ring-4 ring-blue-500/30 ring-offset-1 dark:ring-offset-slate-800 scale-105 z-10";
                        }
                        if (flagged.has(i)) {
                            navBtnClass += " !border-orange-400 dark:!border-orange-500 !bg-orange-100/90 dark:!bg-orange-900/50 text-orange-700 dark:text-orange-400";
                        }
                        return (
                            <button 
                                key={i} 
                                onClick={() => { 
                                    if (appState === 'review') { 
                                        const target = document.getElementById(`review-q-${i}`); 
                                        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' }); 
                                    } else { 
                                        setCurrentIndex(i); 
                                    } 
                                    if (window.innerWidth < 768) setShowMatrix(false);

                        <button onClick={() => { if(window.confirm('Bạn có chắc chắn muốn nộp bài chứ?')) { setAppState('result'); setShowMatrix(false); } }} className="w-full bg-gradient-to-r from-red-500 to-rose-600 hover:from-red-600 hover:to-rose-700 text-white font-black py-4 rounded-xl shadow-[0_10px_25px_-5px_rgba(239,68,68,0.5)] flex items-center justify-center gap-2 uppercase tracking-widest hover:shadow-[0_15px_30px_-5px_rgba(239,68,68,0.6)] transition-all hover:-translate-y-1"><i className="fa-solid fa-paper-plane text-lg"></i> Nộp bài ngay</button>
                    ) : (
                        <button onClick={restartQuiz} className="w-full bg-slate-800 dark:bg-slate-700 text-white font-black py-4 rounded-xl flex items-center justify-center gap-2 hover:bg-slate-900 dark:hover:bg-slate-600 transition-colors shadow-md hover:-translate-y-1"><i className="fa-solid fa-rotate-right text-lg"></i> Làm lại từ đầu</button>
                    )}
                </div>
            </aside>

            <main className="flex-1 flex flex-col h-screen md:order-1 overflow-hidden relative z-10">

                    <div className="flex items-center gap-4">
                        <div className="w-12 h-12 btn-gradient rounded-2xl flex items-center justify-center text-white shadow-lg shadow-blue-200/50 dark:shadow-none"><i className="fa-solid fa-staff-snake text-2xl"></i></div>
                        <div className="hidden sm:block"><h1 className="text-sm font-black text-slate-800 dark:text-slate-100 uppercase tracking-tight drop-shadow-sm">NGOẠI KHOA: {diseaseName}</h1><p className="text-[10px] text-red-600 dark:text-red-400 font-bold uppercase tracking-widest mt-0.5">Tài liệu bởi TeamDrCat</p></div>

                    <div className="flex flex-wrap items-center justify-end gap-x-2 gap-y-3 sm:gap-4 ml-auto" style={{ maxWidth: "calc(100vw - 120px)" }}>

                        <GoogleSearch />
                        
                        <div className="relative group">
                            <button className="p-2.5 bg-white/60 dark:bg-slate-700/60 rounded-xl hover:bg-white dark:hover:bg-slate-600 transition-colors text-slate-600 dark:text-slate-300 border border-white/40 dark:border-slate-600/50 shadow-sm">
                                <i className="fa-solid fa-gear text-lg"></i>
                            </button>
                            <div className="absolute right-0 mt-2 w-48 bg-white/95 dark:bg-slate-800/95 backdrop-blur-md rounded-2xl shadow-2xl border border-white/50 dark:border-slate-700/50 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 z-50 flex flex-col p-2 translate-y-2 group-hover:translate-y-0">
                                <button onClick={() => setIsSoundEnabled(!isSoundEnabled)} className="text-left w-full px-4 py-2.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl flex items-center gap-3 transition-colors">
                                    {isSoundEnabled ? <><i className="fa-solid fa-volume-high text-blue-500 w-5 text-center"></i> <span className="text-sm font-semibold dark:text-slate-300">Tắt âm</span></> : <><i className="fa-solid fa-volume-xmark text-slate-400 w-5 text-center"></i> <span className="text-sm font-semibold dark:text-slate-300">Bật âm</span></>}
                                </button>
                                <button onClick={() => setZoomLevel(prev => Math.min(prev + 10, 150))} className="text-left w-full px-4 py-2.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl flex items-center gap-3 transition-colors">
                                    <i className="fa-solid fa-magnifying-glass-plus text-emerald-500 w-5 text-center"></i> <span className="text-sm font-semibold dark:text-slate-300">Phóng to</span>
                                </button>
                                <button onClick={() => setZoomLevel(prev => Math.max(prev - 10, 50))} className="text-left w-full px-4 py-2.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl flex items-center gap-3 transition-colors">
                                    <i className="fa-solid fa-magnifying-glass-minus text-emerald-500 w-5 text-center"></i> <span className="text-sm font-semibold dark:text-slate-300">Thu nhỏ</span>
                                </button>
                                <button onClick={() => setIsDarkMode(!isDarkMode)} className="text-left w-full px-4 py-2.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl flex items-center gap-3 transition-colors border-t border-slate-100 dark:border-slate-700/50 mt-1 pt-3">
                                    {isDarkMode ? <><i className="fa-solid fa-sun text-amber-500 w-5 text-center"></i> <span className="text-sm font-semibold dark:text-slate-300">Nền Sáng</span></> : <><i className="fa-solid fa-moon text-blue-500 w-5 text-center"></i> <span className="text-sm font-semibold dark:text-slate-300">Nền Tối</span></>}
                                </button>
                            </div>
                        </div>
                        {['quiz', 'review', 'result'].includes(appState) && (
                            <React.Fragment>
                        <button onClick={() => setShowDrNote(!showDrNote)} className="p-2.5 bg-yellow-100/80 dark:bg-yellow-900/50 rounded-xl hover:bg-yellow-200 dark:hover:bg-yellow-800 transition-colors text-yellow-700 dark:text-yellow-400 border border-yellow-300/50 dark:border-yellow-700/50 shadow-sm" title="Mở sổ tay">
                            <i className="fa-solid fa-notes-medical text-lg"></i>
                        </button>
                            </React.Fragment>
                        )}
                        {appState === 'quiz' && (
                            <React.Fragment>
                                <div className={`px-4 py-2 rounded-xl font-mono text-lg font-black border flex items-center gap-3 shadow-sm transition-colors ${timeRemaining < 120 ? 'bg-red-50/90 dark:bg-red-900/50 border-red-300 dark:border-red-700 text-red-600 dark:text-red-400 border-2' : 'bg-white/80 dark:bg-slate-800/80 border-white/80 dark:border-slate-600 text-blue-700 shadow-md dark:text-blue-300'}`}>
                                    <i className={`fa-solid fa-heart-pulse text-xl ${timeRemaining < 120 ? 'animate-heartbeat-fast' : 'animate-heartbeat'}`}></i>
                                    {formatTime(timeRemaining)}
                                </div>
                                <button onClick={togglePause} className="p-2.5 bg-white/60 dark:bg-slate-700/60 rounded-xl hover:bg-white dark:hover:bg-slate-600 transition-colors text-red-600 dark:text-red-400 border border-white/40 dark:border-slate-600/50 shadow-sm">
                                    {isPaused ? <i className="fa-solid fa-play text-lg"></i> : <i className="fa-solid fa-pause text-lg"></i>}
                                </button>
                            </React.Fragment>
                        )}
                        {appState === 'review' && <div className="px-4 py-2 rounded-xl font-black bg-amber-100/90 dark:bg-amber-900/50 text-amber-700 dark:text-amber-400 flex items-center gap-2 border border-amber-300/50 dark:border-amber-700/50 shadow-sm"><i className="fa-solid fa-eye"></i> <span className="hidden sm:inline uppercase text-xs tracking-wider">Xem lại</span></div>}
                        <button className="bg-white/60 dark:bg-slate-700/60 text-red-600 dark:text-red-400 p-2.5 rounded-xl flex items-center justify-center border border-white/40 dark:border-slate-600/50 shadow-sm transition-all hover:bg-white dark:hover:bg-slate-600" onClick={() => setShowMatrix(!showMatrix)} title="Ẩn/Hiện Bảng Câu Hỏi"><i className={`fa-solid ${showMatrix ? 'fa-outdent' : 'fa-bars'} text-lg`}></i></button>
                    </div>
                </header>

                <div ref={scrollContainerRef} className="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar relative z-0">
                    <div className="max-w-4xl mx-auto w-full pb-8">
                        {renderQuizContent()}
                    </div>
                </div>
            </main>
        </div>
    );
}


class ErrorBoundary extends React.Component {
    constructor(props) { super(props); this.state = { hasError: false, error: null, info: null }; }
    static getDerivedStateFromError(error) { return { hasError: true, error }; }
    componentDidCatch(error, info) { this.setState({ error, info }); console.error("REACT CRASH: ", error, info); }
    render() {
        if (this.state.hasError) {
            return (
                <div style={{padding: '40px', background: 'white', color: 'red', minHeight: '100vh', zIndex: 99999, position: 'relative'}}>
                    <h1 style={{fontSize: '24px', fontWeight: 'bold'}}>HỆ THỐNG GẶP LỖI (CRASH)</h1>
                    <p style={{marginTop: '10px'}}>{this.state.error && this.state.error.toString()}</p>
                    <pre style={{marginTop: '20px', background: '#ffebee', padding: '15px', borderRadius: '8px', overflow: 'auto', fontSize: '12px'}}>
                        {this.state.info && this.state.info.componentStack}
                    </pre>
                    <button onClick={() => { localStorage.clear(); window.location.reload(); }} style={{marginTop: '20px', background: 'red', color: 'white', padding: '10px 20px', borderRadius: '8px'}}>Khôi phục / Làm lại từ đầu (Xoá bộ nhớ)</button>
                </div>
            );
        }
        return this.props.children;
    }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><App /></ErrorBoundary>);


</script>
</body>
</html>
